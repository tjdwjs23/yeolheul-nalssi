name: 날씨 데이터 갱신

on:
  schedule:
    # 한국시간 6시·12시·18시 (UTC 21·03·09시)
    - cron: "0 21,3,9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 네이버 날씨 스크래핑
        run: python3 update_weather.py

      - name: data.json 커밋
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "날씨 데이터 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          git push
