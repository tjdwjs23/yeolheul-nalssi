name: 날씨 데이터 갱신

on:
  schedule:
    # 3시간마다 실행. GitHub 예약 실행은 혼잡 시 수 시간 지연되므로
    # 촘촘히 걸어서 항상 최근 몇 시간 내 데이터를 유지한다.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 네이버 날씨 스크래핑
        run: python3 update_weather.py

      - name: data.json 커밋
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "날씨 데이터 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 실행 도중 다른 커밋이 먼저 푸시된 경우를 대비해 리베이스 후 푸시
          # (-X theirs: data.json이 충돌하면 방금 수집한 최신 데이터를 우선)
          git pull --rebase -X theirs
          git push
