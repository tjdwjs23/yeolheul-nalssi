name: 날씨 데이터 갱신

on:
  schedule:
    # 정시 갱신은 cron-job.org가 workflow_dispatch로 호출한다(매일 KST 7·12·17·21시).
    # 아래 자체 예약은 cron-job.org 장애 대비 백업 — GitHub 무료 cron은 절반쯤
    # 누락되므로 4시간 간격 시도(실효 하루 2~3회)면 백업으로 충분하다.
    - cron: "37 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 네이버 날씨 스크래핑
        run: python3 update_weather.py

      - name: data.json 커밋
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "날씨 데이터 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 실행 도중 다른 커밋이 먼저 푸시된 경우를 대비해 리베이스 후 푸시
          # (-X theirs: data.json이 충돌하면 방금 수집한 최신 데이터를 우선)
          git pull --rebase -X theirs
          git push
