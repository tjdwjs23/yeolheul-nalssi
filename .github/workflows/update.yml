name: 날씨 데이터 갱신

on:
  schedule:
    # 2시간마다, 37분에 실행. GitHub 예약 실행은 혼잡 시 지연이 아니라 누락되며
    # 특히 정각(minute 0)이 가장 혼잡해 잘 버려진다(GitHub 공식 안내).
    # 정각을 피하고 시도 횟수를 늘려 일부가 누락돼도 실효 간격을 유지한다.
    - cron: "37 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 네이버 날씨 스크래핑
        run: python3 update_weather.py

      - name: data.json 커밋
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "날씨 데이터 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 실행 도중 다른 커밋이 먼저 푸시된 경우를 대비해 리베이스 후 푸시
          # (-X theirs: data.json이 충돌하면 방금 수집한 최신 데이터를 우선)
          git pull --rebase -X theirs
          git push
