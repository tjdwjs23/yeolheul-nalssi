name: 날씨 데이터 갱신

on:
  schedule:
    # 매시 37분 실행(하루 24회 시도). GitHub 무료 cron은 예약의 절반 이상을
    # 혼잡으로 누락시키므로(실측 발화율 40~50%), 시도를 늘려 실효 갱신 간격을
    # 2~3시간으로 유지한다. 실행당 1분 미만이라 공개 저장소 무료 한도와 무관.
    - cron: "37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 네이버 날씨 스크래핑
        run: python3 update_weather.py

      - name: data.json 커밋
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "날씨 데이터 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 실행 도중 다른 커밋이 먼저 푸시된 경우를 대비해 리베이스 후 푸시
          # (-X theirs: data.json이 충돌하면 방금 수집한 최신 데이터를 우선)
          git pull --rebase -X theirs
          git push
